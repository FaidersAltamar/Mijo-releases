name: Build installers

# Compila los instaladores de Mijo Code desde el repo privado FaidersAltamar/mijocode
# sin publicar su código: solo los instaladores terminan en las Releases de este repo.
# Requiere el secret SOURCE_TOKEN (lectura del repo privado + escritura de releases aquí).

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Rama, tag o commit de mijocode"
        required: false
        default: main
      platforms:
        description: "Plataformas"
        required: false
        default: all
        type: choice
        options:
          - all
          - win
          - mac
          - linux
      publish:
        description: "Publicar en Releases (false = solo artifacts)"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: build-installers
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.SOURCE_TOKEN }}
  MIJOCODE_ENV: production
  # Sin esto la app instalada no busca actualizaciones y dice «desactivadas en compilaciones
  # de desarrollo» (docs/desktop/build-time-optional-capabilities.md).
  MIJOCODE_AUTO_UPDATE: "1"
  ELECTRON_BUILDER_BINARIES_MIRROR: "https://github.com/electron-userland/electron-builder-binaries/releases/download/"
  PUBLISH_MODE: ${{ inputs.publish && 'always' || 'never' }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      sha: ${{ steps.v.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: FaidersAltamar/mijocode
          ref: ${{ inputs.ref }}
          token: ${{ secrets.SOURCE_TOKEN }}
          sparse-checkout: package.json
          sparse-checkout-cone-mode: false
      - id: v
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-win:
    needs: version
    if: ${{ inputs.platforms == 'all' || inputs.platforms == 'win' }}
    runs-on: windows-latest
    env:
      MIJOCODE_COMMIT: ${{ needs.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: FaidersAltamar/mijocode
          ref: ${{ needs.version.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
      - uses: jdx/mise-action@v3
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mijocode/desktop build
      - name: Package (Windows)
        working-directory: packages/desktop
        run: pnpm exec electron-builder --win --config electron-builder.config.js --publish ${{ env.PUBLISH_MODE }}
      - uses: actions/upload-artifact@v4
        with:
          name: installers-windows-x64
          if-no-files-found: error
          retention-days: 7
          path: |
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.blockmap
            packages/desktop/dist/latest*.yml

  build-mac:
    needs: version
    if: ${{ inputs.platforms == 'all' || inputs.platforms == 'mac' }}
    runs-on: macos-15
    env:
      MIJOCODE_COMMIT: ${{ needs.version.outputs.sha }}
      # Developer ID + notarización cuando el repo tiene los secretos de Apple; si faltan,
      # electron-builder firma ad-hoc (ver docs/specs/macos-adhoc-signing.md).
      MIJOCODE_ENABLE_MAC_SIGN: ${{ secrets.APPLE_CERTIFICATE != '' && '1' || '0' }}
      CSC_LINK: ${{ secrets.APPLE_CERTIFICATE }}
      CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: FaidersAltamar/mijocode
          ref: ${{ needs.version.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
      - uses: jdx/mise-action@v3
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mijocode/desktop build
      - name: Package (macOS)
        working-directory: packages/desktop
        run: pnpm exec electron-builder --mac --config electron-builder.config.js --publish ${{ env.PUBLISH_MODE }}
      - uses: actions/upload-artifact@v4
        with:
          name: installers-macos
          if-no-files-found: error
          retention-days: 7
          path: |
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.zip
            packages/desktop/dist/*.blockmap
            packages/desktop/dist/latest*.yml

  # Mac Intel: nunca publica por su cuenta para no pisar el latest-mac.yml de arm64;
  # el job release combina ambos (docs/specs/macos-intel-build.md).
  build-mac-x64:
    needs: version
    if: ${{ inputs.platforms == 'all' || inputs.platforms == 'mac' }}
    runs-on: macos-15-intel
    env:
      MIJOCODE_COMMIT: ${{ needs.version.outputs.sha }}
      MIJOCODE_ENABLE_MAC_SIGN: ${{ secrets.APPLE_CERTIFICATE != '' && '1' || '0' }}
      CSC_LINK: ${{ secrets.APPLE_CERTIFICATE }}
      CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: FaidersAltamar/mijocode
          ref: ${{ needs.version.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
      - uses: jdx/mise-action@v3
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mijocode/desktop build
      - name: Package (macOS Intel)
        working-directory: packages/desktop
        run: pnpm exec electron-builder --mac --x64 --config electron-builder.config.js --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: installers-macos-x64
          if-no-files-found: error
          retention-days: 7
          path: |
            packages/desktop/dist/*-mac-x64.dmg
            packages/desktop/dist/*-mac-x64.zip
            packages/desktop/dist/*-mac-x64.*.blockmap

  build-linux:
    needs: version
    if: ${{ inputs.platforms == 'all' || inputs.platforms == 'linux' }}
    runs-on: ubuntu-latest
    env:
      MIJOCODE_COMMIT: ${{ needs.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: FaidersAltamar/mijocode
          ref: ${{ needs.version.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
      - uses: jdx/mise-action@v3
      - uses: pnpm/action-setup@v4
      - name: Linux packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libarchive-tools
          sudo gem install fpm --no-doc
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mijocode/desktop build
      - name: Package (Linux)
        working-directory: packages/desktop
        run: pnpm exec electron-builder --linux --config electron-builder.config.js --publish ${{ env.PUBLISH_MODE }}
      - uses: actions/upload-artifact@v4
        with:
          name: installers-linux-x64
          if-no-files-found: error
          retention-days: 7
          path: |
            packages/desktop/dist/*.AppImage
            packages/desktop/dist/*.deb
            packages/desktop/dist/*.rpm
            packages/desktop/dist/*.pkg.tar.zst
            packages/desktop/dist/*.blockmap
            packages/desktop/dist/latest*.yml

  # electron-builder crea la release como borrador; solo se publica cuando todo terminó bien.
  release:
    needs: [version, build-win, build-mac, build-mac-x64, build-linux]
    # Si el job version no termina bien (p. ej. GitHub no asigna runner), no hay versión que publicar.
    if: ${{ inputs.publish && !cancelled() && needs.version.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS Intel installers
        if: ${{ needs.build-mac-x64.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: installers-macos-x64
          path: mac-x64
      # Un solo latest-mac.yml para arm64 + x64: MacUpdater elige por "arm64" en el nombre.
      - name: Merge macOS Intel into update feed
        if: ${{ needs.build-mac-x64.result == 'success' && needs.build-mac.result == 'success' }}
        working-directory: mac-x64
        env:
          TAG: v${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # productName lleva espacio y GitHub lo cambia por "." al subir; electron-builder usa "-".
          shopt -s nullglob
          for f in *" "*; do mv "$f" "${f// /-}"; done
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p latest-mac.yml -D base --clobber
          node - <<'EOF'
          const fs = require("fs");
          const crypto = require("crypto");
          const lines = fs.readFileSync("base/latest-mac.yml", "utf8").replace(/\r\n/g, "\n").split("\n");
          const start = lines.indexOf("files:");
          if (start < 0) throw new Error("latest-mac.yml sin lista files");
          let end = start + 1;
          while (end < lines.length && /^\s/.test(lines[end])) end++;
          const existing = new Set(
            lines.slice(start + 1, end).filter((l) => l.startsWith("  - url: ")).map((l) => l.slice(9).trim()),
          );
          const artifacts = fs.readdirSync(".").filter((f) => /-mac-x64\.(zip|dmg)$/.test(f))
            .sort((a, b) => Number(b.endsWith(".zip")) - Number(a.endsWith(".zip")));
          if (artifacts.length === 0) throw new Error("no hay instaladores mac-x64");
          const extra = [];
          for (const file of artifacts) {
            if (existing.has(file)) continue;
            const buf = fs.readFileSync(file);
            const sha512 = crypto.createHash("sha512").update(buf).digest("base64");
            extra.push(`  - url: ${file}`, `    sha512: ${sha512}`, `    size: ${buf.length}`);
          }
          lines.splice(end, 0, ...extra);
          fs.writeFileSync("latest-mac.yml", lines.join("\n"));
          console.log(extra.length ? extra.join("\n") : "latest-mac.yml ya incluía mac-x64");
          EOF
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber ./*-mac-x64.* latest-mac.yml
      - name: Publish release
        run: gh release edit "v${{ needs.version.outputs.version }}" -R "${{ github.repository }}" --draft=false --latest
